# Config do typo-catcher (workflow quality.yml).
# Falsos positivos comuns em repo Nix/infra: hashes, nomes de pacotes,
# chaves SSH, material arquivado.

[files]
extend-exclude = [
  "flake.lock",
  # Instalador binário auto-extraível (payload zip embutido) — src do
  # derivation em modules/packages/hubstaff/default.nix, não é texto.
  "modules/packages/hubstaff/Hubstaff-*.sh",
  # Disassembly ACPI gerado por ferramenta (iasl) — não é texto de humano.
  "hosts/kernelcore/acpi-fix/dsdt.dsl",
  "docs/archive/**",
  "secrets/**",
  "*.age",
  "*.asc",
  "*.gguf",
  "**/*.lock",
]

[default]
# Ignora hashes sri/base64, chaves públicas ssh e store paths
extend-ignore-re = [
  "sha256-[A-Za-z0-9+/=]{40,}",
  "ssh-(ed25519|rsa) [A-Za-z0-9+/=]+",
  "ecdsa-sha2-nistp256 [A-Za-z0-9+/=]+",
  "/nix/store/[a-z0-9]{32}-[^ ]*",
]

[default.extend-words]
# Vocabulário do projeto — não são typos
nixos = "nixos"
hyprland = "hyprland"
waybar = "waybar"
noice = "noice"
# Português nos comentários — "Fase 4", "fase de migração" etc.
fase = "fase"
fases = "fases"
