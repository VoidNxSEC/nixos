name: "Setup Nix Environment"
description: "Configure Nix with flakes and optional Cachix"
author: "VoidNxSEC"

inputs:
  cachix-name:
    description: "Cachix cache name"
    required: false
    default: ""
  cachix-token:
    description: "Cachix authentication token"
    required: false
    default: ""

outputs:
  nix-version:
    description: "Installed Nix version"
    value: ${{ steps.check-nix.outputs.version }}

runs:
  using: "composite"
  steps:
    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@v22
      with:
        extra-conf: |
          experimental-features = nix-command flakes
          accept-flake-config = true
          max-jobs = auto
          cores = 0
          keep-outputs = true
          keep-derivations = true
          substituters = https://cache.nixos.org https://nix-community.cachix.org
          trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=
          connect-timeout = 5
          fallback = true

    - name: Check Nix installation
      id: check-nix
      shell: bash
      run: |

        VERSION=$(nix --version | awk '{print $3}')
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Nix $VERSION installed"

        if command -v nix &> /dev/null; then
          VERSION=$(nix --version | awk '{print $3}')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "✅ Nix $VERSION already installed"
        else
          echo "❌ Nix not found"
          exit 1
        fi

    - name: Configure Nix
      shell: bash
      run: |
        echo "🔧 Configuring Nix..."

        # Create nix.conf if not exists
        sudo mkdir -p /etc/nix

        # Base configuration
        cat << 'EOF' | sudo tee -a /etc/nix/nix.conf
        # GitHub Actions optimizations
        max-jobs = auto
        cores = 0

        # Flakes support
        experimental-features = nix-command flakes

        # Build optimization
        keep-outputs = true
        keep-derivations = true

        # Substituters (with self-hosted cache)
        substituters = http://192.168.15.9:5000 https://cache.nixos.org https://nix-community.cachix.org
        trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=

        # Allow self-hosted cache
        trusted-substituters = http://192.168.15.9:5000

        # Cache connection settings
        connect-timeout = 2
        fallback = true
        EOF

        # Add extra config if provided
        if [ -n "${{ inputs.nix-conf-extra }}" ]; then
          echo "${{ inputs.nix-conf-extra }}" | sudo tee -a /etc/nix/nix.conf
        fi

        echo "✅ Nix configured"

    - name: Setup Cachix
      if: inputs.cachix-name != ''
      shell: bash
      run: |
        nix profile install nixpkgs#cachix
        if [ -n "${{ inputs.cachix-token }}" ]; then
          echo "${{ inputs.cachix-token }}" | cachix authtoken
        fi
        cachix use ${{ inputs.cachix-name }} || echo "Cachix cache unavailable, continuing without it"
