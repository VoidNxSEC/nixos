name: Cloud Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}

jobs:
  build:
    name: Build and push container
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v28

      - name: Build Nix derivation
        run: nix develop --command nix-build tests/default.nix

      - name: Build Docker image
        run: docker build -t gcr.io/${{ env.PROJECT_ID }}/my-nixos-app .

      - name: Push Docker image
        if: github.ref == 'refs/heads/main'
        run: docker push gcr.io/${{ env.PROJECT_ID }}/my-nixos-app
