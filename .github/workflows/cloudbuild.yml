name: Cloud Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}

jobs:
  build:
    name: Build and push container
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v28

      - name: Build Nix derivation
        run: |
          NIXPKGS=$(nix eval --impure --raw \
            "(builtins.getFlake \"path:$PWD\").inputs.nixpkgs.outPath")
          nix-build tests/default.nix -A default -I "nixpkgs=${NIXPKGS}" --show-trace

      - name: Build Docker image
        run: docker build -t gcr.io/${{ env.PROJECT_ID }}/my-nixos-app .

      - name: Push Docker image
        if: github.ref == 'refs/heads/main'
        run: docker push gcr.io/${{ env.PROJECT_ID }}/my-nixos-app
