name: NixOS Config Build

on:
  workflow_dispatch:
    inputs:
      host:
        description: "NixOS host to build"
        required: true
        default: kernelcore
        type: choice
        options:
          - kernelcore
          - kernelcore-iso
          - k8s-node
      target:
        description: "System build target"
        required: true
        default: toplevel
        type: choice
        options:
          - toplevel
          - vm
      upload-result:
        description: "Upload the result symlink as an artifact"
        required: false
        default: false
        type: boolean
  pull_request:
    branches: [main, dev]
    types: [labeled, synchronize, reopened, ready_for_review]
    paths:
      - "flake.nix"
      - "flake.lock"
      - "hosts/**"
      - "modules/**"
      - "overlays/**"
      - "profiles/**"
      - "sec/**"
      - "nix/**"
      - "lib/**"
      - ".github/actions/setup-nix-env/**"
      - ".github/workflows/nixos-config-build.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CACHIX_CACHE_NAME: ${{ vars.CACHIX_CACHE_NAME }}
  DEFAULT_HOST: kernelcore
  DEFAULT_TARGET: toplevel

jobs:
  build:
    name: Build ${{ github.event.inputs.host || 'kernelcore' }} ${{ github.event.inputs.target || 'toplevel' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'build-nixos'))

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Nix
        uses: ./.github/actions/setup-nix-env
        with:
          cachix-name: ${{ env.CACHIX_CACHE_NAME }}
          cachix-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Resolve build attribute
        id: target
        shell: bash
        run: |
          host="${{ github.event.inputs.host || env.DEFAULT_HOST }}"
          target="${{ github.event.inputs.target || env.DEFAULT_TARGET }}"

          case "$target" in
            toplevel)
              attr=".#nixosConfigurations.${host}.config.system.build.toplevel"
              ;;
            vm)
              attr=".#nixosConfigurations.${host}.config.system.build.vm"
              ;;
            *)
              echo "Unsupported target: $target" >&2
              exit 1
              ;;
          esac

          {
            echo "host=$host"
            echo "target=$target"
            echo "attr=$attr"
          } >> "$GITHUB_OUTPUT"

      - name: Build configuration
        id: build
        shell: bash
        run: |
          nix build "${{ steps.target.outputs.attr }}" \
            --show-trace \
            --print-build-logs \
            --print-out-paths

      - name: Report closure size
        run: nix path-info -Sh "${{ steps.target.outputs.attr }}"

      - name: Upload result
        if: github.event_name == 'workflow_dispatch' && github.event.inputs['upload-result'] == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nixos-${{ steps.target.outputs.host }}-${{ steps.target.outputs.target }}
          path: result
          if-no-files-found: error
          retention-days: 7
