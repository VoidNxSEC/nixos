name: NixOS Config Validation

on:
  pull_request:
    branches: [main, dev]
    paths:
      - "flake.nix"
      - "flake.lock"
      - "hosts/**"
      - "modules/**"
      - "overlays/**"
      - "profiles/**"
      - "sec/**"
      - "nix/**"
      - "lib/**"
      - ".github/actions/setup-nix-env/**"
      - ".github/workflows/nixos-config-validation.yml"
  push:
    branches: [main, dev]
    paths:
      - "flake.nix"
      - "flake.lock"
      - "hosts/**"
      - "modules/**"
      - "overlays/**"
      - "profiles/**"
      - "sec/**"
      - "nix/**"
      - "lib/**"
      - ".github/actions/setup-nix-env/**"
      - ".github/workflows/nixos-config-validation.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CACHIX_CACHE_NAME: ${{ vars.CACHIX_CACHE_NAME }}

jobs:
  flake:
    name: Flake checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Nix
        uses: ./.github/actions/setup-nix-env
        with:
          cachix-name: ${{ env.CACHIX_CACHE_NAME }}
          cachix-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Check formatting
        run: nix fmt -- --check .

      - name: Show flake metadata
        run: nix flake metadata --no-write-lock-file

      - name: Run flake check
        run: nix flake check --show-trace --no-build

  evaluate-hosts:
    name: Evaluate ${{ matrix.host }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: flake
    strategy:
      fail-fast: false
      matrix:
        host:
          - kernelcore
          - kernelcore-iso
          - k8s-node

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Nix
        uses: ./.github/actions/setup-nix-env
        with:
          cachix-name: ${{ env.CACHIX_CACHE_NAME }}
          cachix-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Evaluate host toplevel derivation
        run: |
          nix eval \
            ".#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel.drvPath" \
            --show-trace

      - name: Check systemd unit evaluation
        run: |
          nix eval \
            ".#nixosConfigurations.${{ matrix.host }}.config.systemd.units" \
            --apply builtins.attrNames \
            --json \
            --show-trace

  summarize:
    name: Validation summary
    runs-on: ubuntu-latest
    needs:
      - flake
      - evaluate-hosts
    if: always()
    steps:
      - name: Write summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ## NixOS config validation

          - Flake formatting, metadata and checks ran for the repository.
          - NixOS host toplevel derivations were evaluated without building them.
          - Systemd unit sets were evaluated for each configured host.
          SUMMARY

          if [ "${{ needs.flake.result }}" != "success" ] || [ "${{ needs.evaluate-hosts.result }}" != "success" ]; then
            exit 1
          fi
