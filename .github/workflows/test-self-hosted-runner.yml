name: Test Self-Hosted Runner

on:
  push:
    branches: [main]
  workflow_dispatch: # Permite executar manualmente

jobs:
  test-runner:
    runs-on: [self-hosted, nixos]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: System Information
        run: |
          echo "🎉 Self-Hosted Runner is working!"
          echo ""
          echo "📋 System Info:"
          uname -a
          echo ""
          echo "🏠 Hostname:"
          hostname
          echo ""
          echo "👤 User:"
          whoami
          echo ""
          echo "📁 Working Directory:"
          pwd
          echo ""
          echo "💾 Disk Space:"
          df -h / | tail -1
          echo ""
          echo "🧠 Memory:"
          free -h | grep Mem

      - name: Test Nix
        run: |
          echo "🔧 Testing Nix installation..."
          nix --version
          echo ""
          echo "✅ Nix is working!"

      - name: Test Git
        run: |
          echo "🔧 Testing Git..."
          git --version
          echo "Git branch: $(git branch --show-current)"
          echo ""
          echo "✅ Git is working!"

      - name: Test Available Tools
        run: |
          echo "🛠️ Available tools:"
          echo "- curl: $(curl --version | head -1)"
          echo "- jq: $(jq --version)"
          echo "- bash: $BASH_VERSION"
          echo ""
          echo "✅ All tools available!"

      - name: Success Report
        run: |
          echo ""
          echo "╔════════════════════════════════════════╗"
          echo "║                                        ║"
          echo "║   ✅ SELF-HOSTED RUNNER IS WORKING!   ║"
          echo "║                                        ║"
          echo "║   Runner: nixos-self-hosted            ║"
          echo "║   Status: Online and operational       ║"
          echo "║   Host: $(hostname)                    ║"
          echo "║                                        ║"
          echo "╚════════════════════════════════════════╝"
