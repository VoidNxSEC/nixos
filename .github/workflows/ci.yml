name: CI

# CI de repo de configuração NixOS: valida sem buildar o sistema.
# - fmt: nixfmt-tree via `nix fmt`
# - eval: drvPath das 3 nixosConfigurations (validação canônica do repo)
# - checks: flake check --no-build + build do check leve (mcp-server)
#
# Deploy/switch NUNCA acontece por CI — é sempre manual (ver .github/README.md).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Format check (nixfmt-tree)
        run: nix fmt -- --check .

  eval:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host: [kernelcore, kernelcore-iso, k8s-node]
    steps:
      - uses: actions/checkout@v6

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Evaluate ${{ matrix.host }} toplevel
        run: |
          nix eval --raw \
            ".#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel.drvPath"

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - uses: cachix/cachix-action@v16
        if: ${{ github.event_name != 'pull_request' }}
        continue-on-error: true
        with:
          name: voidnxlabs
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Flake check (no build)
        run: nix flake check --no-build

      - name: Build light checks (mcp-server)
        run: nix build ".#checks.x86_64-linux.mcp-server"
