name: PR Validation

on:
  workflow_call:
    inputs:
      config-path:
        description: NixOS configuration path
        required: false
        type: string
        default: .#nixosConfigurations.kernelcore.config.system.build.toplevel
      skip-tests:
        description: Skip test suite
        required: false
        type: boolean
        default: false
    secrets:
      CACHIX_AUTH_TOKEN:
        required: false
      DISCORD_WEBHOOK:
        required: false

  pull_request:
    branches: [main, dev]

permissions:
  contents: read

env:
  CACHIX_NAME: kernelcore
  CONFIG_PATH: ${{ inputs.config-path || '.#nixosConfigurations.kernelcore.config.system.build.toplevel' }}

jobs:
  format-check:
    name: Check Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Nix
        uses: ./.github/actions/setup-nix-env
        with:
          cachix-name: ${{ env.CACHIX_NAME }}
          cachix-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Check Nix formatting
        run: nix fmt -- --check .

      - name: Check for trailing whitespace
        run: git diff --check HEAD^ HEAD

  flake-check:
    name: Validate Flake
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Nix
        uses: ./.github/actions/setup-nix-env
        with:
          cachix-name: ${{ env.CACHIX_NAME }}
          cachix-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Check flake syntax
        run: nix flake check --show-trace

      - name: Validate flake metadata
        run: nix flake metadata

      - name: Check for eval errors
        run: nix eval "$CONFIG_PATH.drvPath" --show-trace

  build-test:
    name: Build Test
    runs-on: ubuntu-latest
    needs: [format-check, flake-check]
    if: ${{ !inputs.skip-tests }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Nix
        uses: ./.github/actions/setup-nix-env
        with:
          cachix-name: ${{ env.CACHIX_NAME }}
          cachix-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build configuration
        uses: ./.github/actions/build-nixos
        with:
          config-path: ${{ env.CONFIG_PATH }}
          enable-tests: true
          show-trace: true

      - name: Check closure size
        run: nix path-info -Sh "$CONFIG_PATH"

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build-test
    if: ${{ always() && !cancelled() }}
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Nix
        uses: ./.github/actions/setup-nix-env
        with:
          cachix-name: ${{ env.CACHIX_NAME }}
          cachix-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Scan for vulnerabilities
        run: |
          nix run nixpkgs#vulnix -- -w \
            "$(nix build "$CONFIG_PATH" --no-link --print-out-paths)" \
            || echo "Vulnerabilities found (non-blocking)"

      - name: Check for exposed secrets
        run: |
          changed_files="$(git diff --name-only origin/${{ github.base_ref }}..HEAD || true)"
          if [ -n "$changed_files" ] && grep -I -E "(password|secret|token|key).*=.*['\"]" $changed_files; then
            echo "Potential secrets found in diff"
            exit 1
          fi

  summary:
    name: PR Summary
    runs-on: ubuntu-latest
    needs: [format-check, flake-check, build-test, security-scan]
    if: always()
    steps:
      - name: Generate summary
        run: |
          echo "## PR Validation Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Check | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Format | ${{ needs.format-check.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Flake | ${{ needs.flake-check.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Build | ${{ needs.build-test.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Security | ${{ needs.security-scan.result }} |" >> "$GITHUB_STEP_SUMMARY"

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify
        with:
          status: failure
          title: PR Validation Failed
          message: PR #${{ github.event.pull_request.number }} validation failed
          discord-webhook: ${{ secrets.DISCORD_WEBHOOK }}
