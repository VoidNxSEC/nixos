name: NixOS Build & Test

on:
  push:
    branches: [main, dev, staging]
  pull_request:
    branches: [staging]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to system after build
        required: false
        default: false
        type: boolean
      build-iso:
        description: Build ISO image
        required: false
        default: false
        type: boolean
      build-vm:
        description: Build VM image
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CACHIX_CACHE_NAME: marcosfpina
  CONFIG_PATH: ".#nixosConfigurations.kernelcore.config.system.build.toplevel"

jobs:
  setup-secrets:
    name: Decrypt SOPS secrets
    uses: ./.github/workflows/setup-sops.yml
    secrets: inherit

  check:
    name: Check Nix flake
    runs-on: ubuntu-latest
    needs: setup-secrets
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Nix
        uses: ./.github/actions/setup-nix-env
        with:
          cachix-name: ${{ env.CACHIX_CACHE_NAME }}
          cachix-token: ${{ needs.setup-secrets.outputs.cachix_token }}

      - name: Check flake syntax
        run: nix flake check --show-trace

      - name: Validate flake metadata
        run: nix flake metadata

      - name: Check for eval errors
        run: nix eval "$CONFIG_PATH.drvPath" --show-trace

  build:
    name: Build NixOS configuration
    runs-on: ubuntu-latest
    needs: [setup-secrets, check]
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Nix
        uses: ./.github/actions/setup-nix-env
        with:
          cachix-name: ${{ env.CACHIX_CACHE_NAME }}
          cachix-token: ${{ needs.setup-secrets.outputs.cachix_token }}

      - name: Build toplevel
        run: nix build "$CONFIG_PATH" --print-build-logs --no-link

      - name: Build ISO
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build-iso }}
        run: nix build .#packages.x86_64-linux.iso --print-build-logs

      - name: Upload ISO
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build-iso }}
        uses: actions/upload-artifact@v4
        with:
          name: nixos-iso
          path: result/
          retention-days: 7

      - name: Build VM image
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build-vm }}
        run: nix build .#packages.x86_64-linux.vm-image --print-build-logs

      - name: Upload VM image
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build-vm }}
        uses: actions/upload-artifact@v5
        with:
          name: nixos-vm-image
          path: result/
          retention-days: 7

  test-modules:
    name: Test NixOS modules
    runs-on: ubuntu-latest
    needs: [setup-secrets, check]
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Nix
        uses: ./.github/actions/setup-nix-env
        with:
          cachix-name: ${{ env.CACHIX_CACHE_NAME }}
          cachix-token: ${{ needs.setup-secrets.outputs.cachix_token }}

      - name: Verify systemd services syntax
        run: nix eval .#nixosConfigurations.kernelcore.config.systemd.services --apply builtins.attrNames

      - name: Test Python dev shell
        run: nix develop .#python --command python --version

      - name: Test CUDA dev shell
        run: nix develop .#cuda --command nvcc --version || echo "CUDA shell test skipped"

      - name: Test Docker image build
        run: nix build .#packages.x86_64-linux.image-app --print-build-logs

      - name: Check derivation closure size
        run: nix path-info -Sh "$CONFIG_PATH"

  security:
    name: Security checks
    runs-on: ubuntu-latest
    needs: [setup-secrets, build]
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Nix
        uses: ./.github/actions/setup-nix-env
        with:
          cachix-name: ${{ env.CACHIX_CACHE_NAME }}
          cachix-token: ${{ needs.setup-secrets.outputs.cachix_token }}

      - name: Check for known vulnerabilities
        run: |
          nix run nixpkgs#vulnix -- -w \
            "$(nix build "$CONFIG_PATH" --no-link --print-out-paths)" \
            || echo "Vulnerabilities found, review required"

      - name: Check for secrets in repo
        run: |
          if grep -R -I "RUNNER_TOKEN.*=" --include="*.nix" .; then
            echo "Found potential exposed runner token"
            exit 1
          fi

  format:
    name: Check formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Nix
        uses: ./.github/actions/setup-nix-env
        with:
          cachix-name: ${{ env.CACHIX_CACHE_NAME }}

      - name: Check Nix formatting
        run: nix fmt -- --check .

  deploy:
    name: Deploy to NixOS
    runs-on: [self-hosted, nixos]
    needs: [setup-secrets, build, test-modules, security, format]
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Nix
        uses: ./.github/actions/setup-nix-env
        with:
          cachix-name: ${{ env.CACHIX_CACHE_NAME }}
          cachix-token: ${{ needs.setup-secrets.outputs.cachix_token }}

      - name: Build system configuration
        run: nix build "$CONFIG_PATH" --print-build-logs

      - name: Switch to new configuration
        run: sudo nixos-rebuild switch --flake .#kernelcore

      - name: Verify system health
        run: |
          systemctl --failed
          journalctl -p err -n 50 --no-pager

  report:
    name: Build report
    runs-on: ubuntu-latest
    needs: [build, test-modules, security]
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Nix
        uses: ./.github/actions/setup-nix-env
        with:
          cachix-name: ${{ env.CACHIX_CACHE_NAME }}

      - name: Generate build summary
        run: |
          echo "## NixOS Build Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Commit:** ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Branch:** ${{ github.ref_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Build Status:** ${{ needs.build.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Tests Status:** ${{ needs.test-modules.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Security Status:** ${{ needs.security.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### System Info" >> "$GITHUB_STEP_SUMMARY"
          nix eval .#nixosConfigurations.kernelcore.config.system.nixos.version --raw >> "$GITHUB_STEP_SUMMARY"
