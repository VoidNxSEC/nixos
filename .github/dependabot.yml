version: 2
updates:
  # GitHub Actions - auto-update workflow dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "ci"

  # Go module (modules/network/dns) - auto-update
  - package-ecosystem: "gomod"
    directory: "/modules/network/dns"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "go"

  # npm (gemini-cli) - manual review required
  # The lockfile is tied to a pinned local tarball (sha256 + npmDepsHash in Nix).
  # Dependabot PRs here require coordinated updates to:
  #   gemini-cli.nix: version, source.sha256, npmDepsHash
  #   storage/: new tarball download
  # Set monthly to surface critical CVEs without creating weekly noise.
  - package-ecosystem: "npm"
    directory: "/modules/packages/gemini"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "npm"
      - "needs-manual-nix-update"
