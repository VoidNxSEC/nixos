name: NixOS Main

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "flake.nix"
      - "flake.lock"
      - "hosts/**"
      - "modules/**"
      - "overlays/**"
      - "profiles/**"
      - "sec/**"
      - "nix/**"
      - "lib/**"
      - ".github/actions/setup-nix-env/**"
      - ".github/workflows/nixos-main.yml"
  push:
    branches: [main]
    paths:
      - "flake.nix"
      - "flake.lock"
      - "hosts/**"
      - "modules/**"
      - "overlays/**"
      - "profiles/**"
      - "sec/**"
      - "nix/**"
      - "lib/**"
      - ".github/actions/setup-nix-env/**"
      - ".github/workflows/nixos-main.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CACHIX_CACHE_NAME: ${{ vars.CACHIX_CACHE_NAME }}

jobs:
  promotion-gate:
    name: Require staging source
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Validate promotion source
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_REF" != "staging" ]; then
            echo "Main accepts release PRs from staging only." >&2
            echo "Current source branch: $HEAD_REF" >&2
            exit 1
          fi

  release-validation:
    name: Release validation
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: promotion-gate
    if: >-
      always() &&
      (github.event_name != 'pull_request' || needs.promotion-gate.result == 'success') &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Nix
        uses: ./.github/actions/setup-nix-env
        with:
          cachix-name: ${{ env.CACHIX_CACHE_NAME }}
          cachix-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Check formatting
        run: nix fmt -- --check .

      - name: Evaluate flake outputs
        run: nix flake check --show-trace --no-build

      - name: Evaluate all host toplevel derivations
        run: |
          for host in kernelcore kernelcore-iso k8s-node; do
            nix eval \
              ".#nixosConfigurations.${host}.config.system.build.toplevel.drvPath" \
              --show-trace
          done

  production-build:
    name: Build production host
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: release-validation

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Nix
        uses: ./.github/actions/setup-nix-env
        with:
          cachix-name: ${{ env.CACHIX_CACHE_NAME }}
          cachix-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build kernelcore toplevel
        run: |
          nix build \
            ".#nixosConfigurations.kernelcore.config.system.build.toplevel" \
            --show-trace \
            --print-build-logs \
            --no-link
